<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests"
  />
  <meta name="referrer" content="no-referrer" />
  <title>Page introuvable · Patrice Lauret</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .error-panel {
      width: min(100%, 640px);
      display: grid;
      gap: 22px;
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .error-panel h1 {
      white-space: normal;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-panel" aria-labelledby="error-title">
      <span class="label">404</span>
      <h1 id="error-title">Page introuvable</h1>
      <p class="hero-lead">La page demandée n’existe pas ou a été déplacée.</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="./">Retour au portfolio</a>
      </div>
    </section>
  </main>
</body>
</html>
